<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Usuario</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style-perfil.css" />
  </head>
  <body>
    <article class="tarjeta">
      <img
        class="avatar"
        src="https://ui-avatars.com/api/?name=Camilo+Vanegas&background=random"
        alt="Avatar de Camilo Vanegas"
      />
      <h1>Camilo Vanegas</h1>
      <p class="cargo">Estudiante</p>

      <div class="stats">
        <div class="stat-item"><span>Nombre: </span> <small>Camilo</small></div>
        <div class="stat-item"><span>Cargo: </span> <small>Admin</small></div>
      </div>

      <button class="btn-accion">Contactar</button>
    </article>
  </body>
</html>
